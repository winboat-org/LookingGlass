name: Windows guest build
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Build static CRT IDD and helper
        shell: pwsh
        run: |
          ./packaging/windows-build.ps1 -Source $env:GITHUB_WORKSPACE -Revision $env:GITHUB_SHA
      - uses: actions/upload-artifact@v4
        with:
          name: looking-glass-windows-x64
          path: out/*.tar.gz
          if-no-files-found: error
          retention-days: 90
